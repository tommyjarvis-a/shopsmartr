name: Data check

# Weekly, Sunday 12:00 UTC (7 AM EST / 8 AM EDT). Validates the curated store directory and runs the
# unit tests. It never crawls or fetches retailer sites; the directory is maintained by hand.
on:
  schedule:
    - cron: '0 12 * * 0'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data/stores.json and data/zips.json
        run: node tools/validate-data.mjs
      - name: Unit tests
        run: node --test "test/*.test.mjs"
